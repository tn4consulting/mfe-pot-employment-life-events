frontend:
  name: employment-life-events-mfe
  replicaCount: 1
  image:
    repository: mfe-pot-employment-life-events-mfe
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  servicePort: 80
  # This app now has a src/runtime-config.ts and public/env.js (added
  # specifically for ContentClient's strapiBaseUrl -- see
  # content-client.token.ts in libs/feature-guided-journey). strapiBaseUrl
  # is browser-to-server, the real public Ingress hostname from
  # mfe-pot-platform's charts/strapi, not in-cluster Service DNS.
  runtimeConfig:
    strapiBaseUrl: "http://cms.mfe-pot.local"
    # Browser-reachable Ingress host, not in-cluster Service DNS -- see
    # mfe-pot-platform/charts/otel-collector.
    otelExporterOtlpEndpoint: "http://otel.mfe-pot.local"

ingress:
  host: employment-life-events-mfe.mfe-pot.local
  className: nginx
  # TLS is off by default (kind/local has no real cert authority) --
  # values-eks.yaml turns this on for a real AWS deployment. See
  # templates/ingress.yaml for how these two fields are consumed.
  tls:
    enabled: false
    clusterIssuer: letsencrypt-staging
