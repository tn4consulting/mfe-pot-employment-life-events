apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employment-life-events-mfe
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # No backend to split on -- employment-life-events has no
          # co-located BFF, so this is a single plain prefix match, same
          # as shell's chart.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.servicePort | default 80 }}
