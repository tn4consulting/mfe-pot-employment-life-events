@if (hasAccess()) {
  @if (intro(); as content) {
    <section>
      <h1>{{ content.title }}</h1>
      <p>{{ content.body }}</p>
    </section>
  } @else if (introLoadError()) {
    <p role="alert">Page content is temporarily unavailable.</p>
  }
  <lib-employment-life-events-feature-guided-journey
    [paymentsHeading]="'journey.paymentsHeading' | transloco"
    [widgetUnavailableText]="'journey.widgetUnavailable' | transloco"
  ></lib-employment-life-events-feature-guided-journey>
} @else {
  <p role="alert">{{ 'auth.signInRequired' | transloco }}</p>
}
<router-outlet></router-outlet>
